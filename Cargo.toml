[workspace]
members = [
    "crates/sdkt-core",
    "crates/sdkt-xdr",
    "crates/sdkt-cli",
    "crates/sdkt-rpc",
    "crates/sdkt-storage", "crates/sdkt-wasm",
    "crates/sdkt-audit",
    "crates/sdkt-audit-example-rule",
]
# Browser-only glue crate for the Web Playground. Excluded so that
# `cargo build/clippy/test --workspace` stays a pure native build; it is built
# explicitly for wasm32-unknown-unknown via website/playground/build.sh.
exclude = ["crates/sdkt-playground"]
resolver = "2"

[workspace.package]
version = "2.5.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
authors = ["SaboLabs"]
repository = "https://github.com/SaboLabs/soroban-devkit"
homepage = "https://github.com/SaboLabs/soroban-devkit"
description = "Unified offline-capable toolkit and CLI for Stellar / Soroban development"
keywords = ["stellar", "soroban", "blockchain", "web3", "cli"]
categories = ["command-line-utilities", "development-tools"]
