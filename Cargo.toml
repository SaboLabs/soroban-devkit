[workspace]
members = [
    "crates/sdkt-core",
    "crates/sdkt-xdr",
    "crates/sdkt-cli",
    "crates/sdkt-rpc",
    "crates/sdkt-storage", "crates/sdkt-wasm",
    "crates/sdkt-audit",
    "crates/sdkt-audit-example-rule",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
authors = ["naninu123"]
repository = "https://github.com/naninu123/soroban-devkit"
homepage = "https://github.com/naninu123/soroban-devkit"
description = "Soroban DevKit (sdkt) — unified Stellar/Soroban developer toolkit"
