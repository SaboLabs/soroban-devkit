[package]
name = "sdkt-fuzz"
description = "Soroban-aware deterministic execution core for SDKT release assurance: fresh-Host execution, baseline state, module-cache reuse, typed observation, and canonical finding artifacts."
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sdkt-fuzz"
keywords = ["soroban", "stellar", "fuzzing", "deterministic", "security"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
# The only crate in the workspace that may depend on the Soroban host engine.
# Everything else treats execution as an opaque, untrusted dependency.
#
# Pinned to 29.0.0: the host protocol must match the network's. Live mainnet
# and testnet report protocol 29 (`getNetwork.protocolVersion`), and
# soroban-env-host 28.0.2 refuses a ledger protocol above 28 in
# `Host::check_ledger_protocol_supported`. env-host 29.0.0 re-exports the same
# stellar-xdr 28.0.0 types (`soroban-env-common 29.0.0` pins
# `stellar-xdr = "=28.0.0"`), so the workspace's XDR version is unchanged.
soroban-env-host = "=29.0.0"

# ContractSpec source of truth: the generator consumes sdkt-wasm's parsed
# model. There is deliberately no second ContractSpec parser in this crate.
sdkt-wasm = { version = "2.7.0", path = "../sdkt-wasm" }

sha2 = "0.11"
thiserror = "2"

# Same pinned version the host re-exports as `soroban_env_host::xdr`
# (feature unification = one compiled crate). The `serde` feature backs the
# canonical artifact format; `soroban_env_host::xdr::ScVal` and the
# `stellar_xdr::ScVal` used here are the same type.
stellar-xdr = { version = "=28.0.0", features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1"
soroban-env-host = "=29.0.0"
sdkt-rpc = { version = "2.7.0", path = "../sdkt-rpc" }
sdkt-wasm = { version = "2.7.0", path = "../sdkt-wasm" }
sdkt-xdr = { version = "2.7.0", path = "../sdkt-xdr" }
getrandom = "0.4"
stellar-strkey = "0.0.18"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
