[package]
name = "sdkt-wasm"
description = "WASM binary metadata parser for Soroban DevKit — exports, imports, custom sections, and hashing."
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["soroban", "stellar", "sdk", "toolkit", "wasm"]
categories = ["development-tools", "wasm"]

[dependencies]
sdkt-core = { version = "2.0.0", path = "../sdkt-core" }
wasmparser = "0.255"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4.3"
stellar-xdr = { version = "28.0.0", features = ["std", "serde"] }
