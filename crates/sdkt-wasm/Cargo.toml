[package]
name = "sdkt-wasm"
description = "WASM binary metadata parser for Soroban DevKit — exports, imports, custom sections, and hashing."
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sdkt-wasm"
keywords = ["soroban", "stellar", "sdk", "toolkit", "wasm"]
categories = ["development-tools", "wasm"]

[dependencies]
# NOTE: sdkt-core is intentionally NOT a dependency here. This crate never
# referenced it (verified: no `sdkt_core` path in src/), and sdkt-core pulls in
# zstd/tar, whose C sources block compiling this crate for
# wasm32-unknown-unknown (needed by the Web Playground glue crate).
wasmparser = "0.257"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4.3"
stellar-xdr = { version = "28.0.0", features = ["std", "serde"] }
