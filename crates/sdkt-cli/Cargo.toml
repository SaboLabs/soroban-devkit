[package]
name = "sdkt-cli"
description = "Command Line Interface (CLI) application combining core Soroban DevKit components."
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["soroban", "stellar", "sdk", "toolkit", "blockchain"]
categories = ["development-tools", "network-programming"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
sdkt-core = { version = "0.16.0-alpha", path = "../sdkt-core" }
sdkt-rpc = { version = "0.16.0-alpha", path = "../sdkt-rpc" }
sdkt-storage = { version = "0.16.0-alpha", path = "../sdkt-storage" }
sdkt-xdr = { version = "0.16.0-alpha", path = "../sdkt-xdr" }
sdkt-wasm = { version = "0.16.0-alpha", path = "../sdkt-wasm" }
sdkt-audit = { version = "0.16.0-alpha", path = "../sdkt-audit" }
stellar-xdr = { version = "28.0.0", features = ["std", "arbitrary", "serde"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3"
