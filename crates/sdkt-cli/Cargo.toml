[package]
name = "sdkt"
description = "Command Line Interface (CLI) application combining core Soroban DevKit components."
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sdkt"
keywords = ["soroban", "stellar", "sdk", "toolkit", "blockchain"]
categories = ["development-tools", "network-programming"]

[[bin]]
name = "sdkt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
sdkt-core = { version = "2.0.0", path = "../sdkt-core" }
sdkt-rpc = { version = "2.0.0", path = "../sdkt-rpc" }
sdkt-storage = { version = "2.0.0", path = "../sdkt-storage" }
sdkt-xdr = { version = "2.0.0", path = "../sdkt-xdr" }
sdkt-wasm = { version = "2.0.0", path = "../sdkt-wasm" }
sdkt-audit = { version = "2.0.0", path = "../sdkt-audit" }
sdkt-audit-example-rule = { version = "2.0.0", path = "../sdkt-audit-example-rule", optional = true }
stellar-xdr = { version = "28.0.0", features = ["std", "arbitrary", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
# Links the reference example plugin rule into the binary. Off by default so
# `sdkt audit` output is byte-for-byte identical to M16 unless explicitly built
# with the plugin feature.
plugins = ["sdkt-audit-example-rule", "sdkt-audit/plugins"]

# WebAssembly plugin loading (M19, Phase C). Off by default.
wasm-plugins = [
    "sdkt-audit/wasm-plugins",
    "sdkt-audit-example-rule/wasm-plugins",
]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3"
