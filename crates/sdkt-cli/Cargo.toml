[package]
name = "sdkt-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
sdkt-core = { path = "../sdkt-core" }
sdkt-rpc = { path = "../sdkt-rpc" }
sdkt-storage = { path = "../sdkt-storage" }
sdkt-xdr = { path = "../sdkt-xdr" }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
