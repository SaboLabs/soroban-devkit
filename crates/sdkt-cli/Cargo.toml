[package]
description = "Command Line Interface (CLI) application combining core Soroban DevKit components."
repository = "https://github.com/naninu123/soroban-devkit"
homepage = "https://github.com/naninu123/soroban-devkit"
readme = "../../README.md"
keywords = ["soroban", "stellar", "sdk", "toolkit", "blockchain"]
categories = ["development-tools", "network-programming"]
license = "MIT"
name = "sdkt-cli"
version = "0.6.0-alpha"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
sdkt-core = { version = "0.6.0-alpha", path = "../sdkt-core" }
sdkt-rpc = { version = "0.6.0-alpha", path = "../sdkt-rpc" }
sdkt-storage = { version = "0.6.0-alpha", path = "../sdkt-storage" }
sdkt-xdr = { version = "0.6.0-alpha", path = "../sdkt-xdr" }
sdkt-wasm = { version = "0.6.0-alpha", path = "../sdkt-wasm" }
sdkt-audit = { version = "0.6.0-alpha", path = "../sdkt-audit" }
stellar-xdr = { version = "28.0.0", features = ["std", "arbitrary", "serde"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3"
