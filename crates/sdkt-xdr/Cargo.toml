[package]
name = "sdkt-xdr"
version = "0.6.0-alpha"
edition = "2021"
description = "XDR encoding and decoding pipelines customized for Soroban smart contracts."
repository = "https://github.com/naninu123/soroban-devkit"
homepage = "https://github.com/naninu123/soroban-devkit"
readme = "../../README.md"
keywords = ["soroban", "stellar", "sdk", "toolkit", "blockchain"]
categories = ["development-tools", "network-programming"]
license = "MIT"

[dependencies]
stellar-xdr = { version = "28.0.0", features = ["std", "arbitrary", "serde"] }
base64 = "0.23"
hex = "0.4"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sdkt-core = { version = "0.6.0-alpha", path = "../sdkt-core" }
stellar-strkey = "0.0.18"
