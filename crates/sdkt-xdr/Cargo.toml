[package]
name = "sdkt-xdr"
description = "XDR encoding and decoding pipelines customized for Soroban smart contracts."
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["soroban", "stellar", "sdk", "toolkit", "blockchain"]
categories = ["development-tools", "network-programming"]

[dependencies]
stellar-xdr = { version = "28.0.0", features = ["std", "arbitrary", "serde"] }
base64 = "0.23"
hex = "0.4"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sdkt-core = { version = "0.16.0-alpha", path = "../sdkt-core" }
stellar-strkey = "0.0.18"
sdkt-wasm = { version = "0.16.0-alpha", path = "../sdkt-wasm" }
