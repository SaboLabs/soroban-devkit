[package]
name = "sdkt-audit"
description = "Static security analysis for Soroban contracts (Gap C)."
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true

readme = "../../README.md"
documentation = "https://docs.rs/sdkt-audit"
[dependencies]
syn = { version = "3", features = ["full", "visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
dirs = "6"
toml = "0.9"
sdkt-wasm = { version = "2.4.0", path = "../sdkt-wasm" }
libloading = { version = "0.9", optional = true }
extism = { version = "1.30.0", optional = true }

[features]
# Native dynamic plugin loading (M18, Phase B). Off by default so the default
# build stays free of libloading and crates.io publish is unaffected.
plugins = ["dep:libloading"]

# WebAssembly plugin loading (M19, Phase C). Off by default.
wasm-plugins = ["dep:extism", "dep:serde_json"]

[dev-dependencies]
tempfile = "3"
