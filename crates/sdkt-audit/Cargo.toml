[package]
name = "sdkt-audit"
description = "Static security analysis for Soroban contracts (Gap C)."
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sdkt-wasm = { version = "1.0.0", path = "../sdkt-wasm" }
libloading = { version = "0.8", optional = true }

[features]
# Native dynamic plugin loading (M18, Phase B). Off by default so the default
# build stays free of libloading and crates.io publish is unaffected.
plugins = ["dep:libloading"]

[dev-dependencies]
