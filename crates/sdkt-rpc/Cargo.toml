[package]
name = "sdkt-rpc"
description = "Soroban JSON-RPC client, endpoint configurations and network connectivity wrapper."
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sdkt-rpc"
keywords = ["soroban", "stellar", "sdk", "toolkit", "blockchain"]
categories = ["development-tools", "network-programming"]

[dependencies]
sdkt-core = { version = "2.5.0", path = "../sdkt-core" }
sdkt-xdr = { version = "2.5.0", path = "../sdkt-xdr" }
stellar-xdr = { version = "28.0.0", features = ["std", "arbitrary", "serde"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "gzip", "deflate"] }
tokio = { version = "1.53.1", features = ["time"] }
sdkt-wasm = { version = "2.5.0", path = "../sdkt-wasm" }
hex = "0.4"

[dev-dependencies]
flate2 = "1"
hex = "0.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
