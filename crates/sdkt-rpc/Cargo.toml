[package]
name = "sdkt-rpc"
description = "Soroban JSON-RPC client, endpoint configurations and network connectivity wrapper."
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["soroban", "stellar", "sdk", "toolkit", "blockchain"]
categories = ["development-tools", "network-programming"]

[dependencies]
sdkt-core = { version = "0.17.0-alpha", path = "../sdkt-core" }
sdkt-xdr = { version = "0.17.0-alpha", path = "../sdkt-xdr" }
stellar-xdr = { version = "28.0.0", features = ["std", "arbitrary", "serde"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1.53.1", features = ["time"] }
sdkt-wasm = { version = "0.17.0-alpha", path = "../sdkt-wasm" }

[dev-dependencies]
