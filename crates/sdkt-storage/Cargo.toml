[package]
name = "sdkt-storage"
version = "0.1.0"
edition = "2021"
description = "Soroban storage analysis for Soroban DevKit"
license = "MIT OR Apache-2.0"

[dependencies]
sdkt-rpc = { path = "../sdkt-rpc" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }