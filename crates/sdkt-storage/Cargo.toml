[package]
name = "sdkt-storage"
description = "Storage monitoring utility and TTL extensions logic for Soroban contracts."
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["soroban", "stellar", "sdk", "toolkit", "blockchain"]
categories = ["development-tools", "network-programming"]

[dependencies]
directories = "5.0.1"
ed25519-dalek = { version = "2.1.0", features = ["rand_core"] }
rand = "0.8"
sdkt-rpc = { version = "2.0.0", path = "../sdkt-rpc" }
sdkt-wasm = { version = "2.0.0", path = "../sdkt-wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-strkey = "0.0.18"
stellar-xdr = { version = "28.0.0", features = ["std", "base64"] }
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
