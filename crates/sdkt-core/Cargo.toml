[package]
description = "Core types, configurations, and format handling for the Soroban DevKit toolkit."
repository = "https://github.com/naninu123/soroban-devkit"
homepage = "https://github.com/naninu123/soroban-devkit"
readme = "../../README.md"
keywords = ["soroban", "stellar", "sdk", "toolkit", "blockchain"]
categories = ["development-tools", "network-programming"]
license = "MIT"
name = "sdkt-core"
version = "0.6.0-alpha"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
stellar-strkey = "0.0.8"
stellar-xdr = { version = "28.0.0", features = ["base64"] }
thiserror = "2.0.19"
toml = "0.8"
