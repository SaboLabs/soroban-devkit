name: sdkt Action CI

# Validates the reusable composite Action (.github/actions/sdkt/action.yml)
# against the committed WASM fixtures. This is packaging validation only —
# no Rust is rebuilt; it installs the pinned sdkt binary and runs the Action.

on:
  push:
    branches: [ "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Breaking upgrade: us_old.wasm -> us_new.wasm is NOT backwards-compatible.
      # The upgrade-safety mode MUST fail this step.
      - name: Upgrade-safety should FAIL on breaking change
        id: breaking
        continue-on-error: true
        uses: ./.github/actions/sdkt
        with:
          command: upgrade-safety
          sdkt-version: v0.15.0-alpha
          old-wasm: crates/sdkt-cli/tests/fixtures/us_old.wasm
          new-wasm: crates/sdkt-cli/tests/fixtures/us_new.wasm

      - name: Assert breaking upgrade was detected (step failed as expected)
        shell: bash
        run: |
          if [ "${{ steps.breaking.outcome }}" != "failure" ]; then
            echo "::error::expected upgrade-safety to FAIL on a breaking change, but outcome was '${{ steps.breaking.outcome }}'"
            exit 1
          fi
          echo "OK: breaking upgrade correctly failed."

      # Compatible upgrade: us_old.wasm -> us_old.wasm is identical (compatible).
      # The upgrade-safety mode MUST pass this step.
      - name: Upgrade-safety should PASS on compatible (identical) upgrade
        id: compatible
        uses: ./.github/actions/sdkt
        with:
          command: upgrade-safety
          sdkt-version: v0.15.0-alpha
          old-wasm: crates/sdkt-cli/tests/fixtures/us_old.wasm
          new-wasm: crates/sdkt-cli/tests/fixtures/us_old.wasm

      - name: Assert compatible upgrade passed
        shell: bash
        run: |
          if [ "${{ steps.compatible.outcome }}" != "success" ]; then
            echo "::error::expected upgrade-safety to PASS on a compatible upgrade, but outcome was '${{ steps.compatible.outcome }}'"
            exit 1
          fi
          echo "OK: compatible upgrade correctly passed."

      # Release assurance: us_new.wasm against the us_old.wasm baseline is a
      # breaking upgrade, so release_status MUST be FAIL and the step MUST fail.
      - name: Release-assurance should FAIL on breaking previous-wasm
        id: ra_breaking
        continue-on-error: true
        uses: ./.github/actions/sdkt
        with:
          command: release-assurance
          wasm: crates/sdkt-cli/tests/fixtures/us_new.wasm
          previous-wasm: crates/sdkt-cli/tests/fixtures/us_old.wasm

      - name: Assert release-assurance reported FAIL
        shell: bash
        run: |
          if [ "${{ steps.ra_breaking.outcome }}" != "failure" ]; then
            echo "::error::expected release-assurance to FAIL on a breaking baseline, but outcome was '${{ steps.ra_breaking.outcome }}'"
            exit 1
          fi
          echo "OK: release-assurance correctly failed on a breaking baseline."

      # Release assurance: the candidate alone (no --contract) leaves the
      # on-chain sections SKIPPED, so the aggregate is REVIEW — which the CLI
      # treats as exit 0, and the Action MUST NOT fail.
      - name: Release-assurance should PASS with REVIEW (no on-chain check)
        id: ra_review
        uses: ./.github/actions/sdkt
        with:
          command: release-assurance
          wasm: crates/sdkt-cli/tests/fixtures/us_new.wasm

      - name: Assert release-assurance REVIEW passed
        shell: bash
        run: |
          if [ "${{ steps.ra_review.outcome }}" != "success" ]; then
            echo "::error::expected release-assurance to PASS with REVIEW, but outcome was '${{ steps.ra_review.outcome }}'"
            exit 1
          fi
          echo "OK: release-assurance REVIEW did not fail the build."

      # Size policy forwarding + compliance: us_new.wasm is 530 bytes.
      # --max-size-bytes 1024 is satisfied, so the release must NOT fail.
      - name: Release-assurance should PASS with a satisfied size ceiling
        id: ra_size_ok
        uses: ./.github/actions/sdkt
        with:
          command: release-assurance
          wasm: crates/sdkt-cli/tests/fixtures/us_new.wasm
          max-size-bytes: "1024"

      - name: Assert satisfied size ceiling passed
        shell: bash
        run: |
          if [ "${{ steps.ra_size_ok.outcome }}" != "success" ]; then
            echo "::error::expected release-assurance to PASS under --max-size-bytes 1024, but outcome was '${{ steps.ra_size_ok.outcome }}'"
            exit 1
          fi
          echo "OK: max-size-bytes was accepted and the satisfied ceiling did not fail the release."

      # Size policy ENFORCEMENT — the discriminating check. The same 530-byte
      # artifact under a 256-byte ceiling goes artifact FAIL -> release_status
      # FAIL, which the Action turns into a step failure. Without the input
      # forwarded this run is the plain ra_review case and stays green, so
      # failure here is positive proof the flag reaches the CLI. Boundaries are
      # inclusive, hence 256 < 530 rather than 530.
      - name: Release-assurance should FAIL on exceeded max-size-bytes
        id: ra_size_violation
        continue-on-error: true
        uses: ./.github/actions/sdkt
        with:
          command: release-assurance
          wasm: crates/sdkt-cli/tests/fixtures/us_new.wasm
          max-size-bytes: "256"

      - name: Assert exceeded size ceiling failed
        shell: bash
        run: |
          if [ "${{ steps.ra_size_violation.outcome }}" != "failure" ]; then
            echo "::error::expected release-assurance to FAIL under --max-size-bytes 256, but outcome was '${{ steps.ra_size_violation.outcome }}' — the Action may not be forwarding max-size-bytes"
            exit 1
          fi
          echo "OK: max-size-bytes forwarding proven — the ceiling violation failed the release."

      # CLI ERROR propagation: --max-growth-pct without --previous-wasm is
      # rejected by the CLI before any report is produced, so there is no
      # .release_status to gate on and the failure must come from the exit code
      # alone. Without that the step would stay green on a misconfigured
      # policy that never ran.
      - name: Release-assurance should FAIL on a CLI error with no report
        id: ra_cli_error
        continue-on-error: true
        uses: ./.github/actions/sdkt
        with:
          command: release-assurance
          wasm: crates/sdkt-cli/tests/fixtures/us_new.wasm
          max-growth-pct: "10"

      - name: Assert CLI error propagated
        shell: bash
        run: |
          if [ "${{ steps.ra_cli_error.outcome }}" != "failure" ]; then
            echo "::error::expected release-assurance to FAIL when the CLI rejects the invocation, but outcome was '${{ steps.ra_cli_error.outcome }}' — the Action is not propagating the CLI exit code"
            exit 1
          fi
          echo "OK: a CLI error with no JSON report still failed the step."
