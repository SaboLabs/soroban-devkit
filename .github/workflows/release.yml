name: Release

# Publishes prebuilt sdkt binaries and crates on a version tag (v*).
# Mirrors the CI gates (fmt/clippy/test) before shipping.

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Formatting
        run: cargo fmt --all --check
      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Tests
        run: cargo test --workspace

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish dry-run (whole workspace)
        # Validate packaging/uploadability of the entire workspace without
        # contacting crates.io for unpublished sibling crates. Unlike a
        # per-crate loop, this does not emit false-negative "no matching
        # version" errors for siblings that are not yet published.
        run: cargo publish --dry-run --workspace

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag vs Cargo version
        run: |
          # Release must be cut from a vX.Y.Z tag.
          TAG="${{ github.ref_name }}"
          echo "Release tag: $TAG"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) TAG_VER="${TAG#v}" ;;
            *) echo "error: ref '$TAG' is not a vX.Y.Z tag" >&2; exit 1 ;;
          esac
          # Cargo workspace version (single source of truth).
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)".*/\1/')"
          echo "Cargo workspace version: $CARGO_VER"
          if [[ "$TAG_VER" != "$CARGO_VER" ]]; then
            echo "error: git tag ($TAG_VER) != Cargo version ($CARGO_VER)" >&2
            echo "Fix: bump Cargo.toml version to match the tag, or retag." >&2
            exit 1
          fi
          echo "OK: tag $TAG matches Cargo version $CARGO_VER"

  build-binaries:
    needs: [validate, version-check]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin sdkt
      - name: Smoke test binary
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            BIN=target/${{ matrix.target }}/release/sdkt.exe
            echo "Running Windows smoke test on native runner..."
            VERSION=$($BIN --version)
            echo "Version reported: $VERSION"

            TAG_VER="${{ github.ref_name }}"
            TAG_VER="${TAG_VER#v}"
            BIN_VER="$(echo "$VERSION" | awk '{print $2}')"
            if [[ "$BIN_VER" != "$TAG_VER" ]]; then
              echo "error: binary version '$BIN_VER' != release tag '$TAG_VER'" >&2
              exit 1
            fi
            echo "OK: binary version $BIN_VER matches tag $TAG_VER"

            $BIN help
            $BIN wasm inspect crates/sdkt-cli/tests/fixtures/us_old.wasm
          else
            BIN=target/${{ matrix.target }}/release/sdkt
            chmod +x "$BIN"

            # Native platforms: verify the binary actually runs offline commands.
            if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" && "${{ matrix.os }}" == "ubuntu-latest" ]]; then
              RUN="$BIN"
            elif [[ "${{ matrix.target }}" == "aarch64-apple-darwin" && "$(uname -m)" == "arm64" ]]; then
              RUN="$BIN"
            elif [[ "${{ matrix.target }}" == "x86_64-apple-darwin" && "${{ matrix.os }}" == "macos-latest" ]]; then
              # Cross-compiled on an arm64 runner; run under Rosetta if available.
              RUN="arch -x86_64 $BIN"
            else
              echo "Skipping execution smoke test on cross-compiled target."
              RUN=""
            fi

            if [[ -n "$RUN" ]]; then
              echo "Running smoke test on native architecture..."
              VERSION=$($RUN --version)
              echo "Version reported: $VERSION"

              # Guardrail: the built binary MUST report the release tag version.
              TAG_VER="${{ github.ref_name }}"
              TAG_VER="${TAG_VER#v}"
              BIN_VER="$(echo "$VERSION" | awk '{print $2}')"
              if [[ "$BIN_VER" != "$TAG_VER" ]]; then
                echo "error: binary version '$BIN_VER' != release tag '$TAG_VER'" >&2
                echo "The package version was not bumped to match the tag." >&2
                exit 1
              fi
              echo "OK: binary version $BIN_VER matches tag $TAG_VER"

              $RUN help
              # Real offline command against repo fixtures — proves the shipped
              # binary is functional, not just that it starts.
              $RUN wasm inspect crates/sdkt-cli/tests/fixtures/us_old.wasm
            fi
          fi

      - name: Generate Checksums
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            BIN=sdkt.exe
          else
            BIN=sdkt
          fi
          if command -v shasum &> /dev/null; then
            shasum -a 256 "$BIN" > sdkt.sha256
          else
            sha256sum "$BIN" > sdkt.sha256
          fi
          # Standalone per-target checksum asset for release verification.
          cp sdkt.sha256 "sdkt-${{ matrix.target }}.sha256"
          cd -

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czf "sdkt-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" sdkt sdkt.sha256

      - name: Verify tarball contents (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          # Regression guard: the release tarball MUST contain both the binary
          # and its checksum (sdkt + sdkt.sha256), per M16 / README.
          echo "Contents of sdkt-${{ matrix.target }}.tar.gz:"
          tar -tzf "sdkt-${{ matrix.target }}.tar.gz"
          tar -tzf "sdkt-${{ matrix.target }}.tar.gz" | grep -qx sdkt \
            || { echo "FAIL: sdkt binary missing from tarball"; exit 1; }
          tar -tzf "sdkt-${{ matrix.target }}.tar.gz" | grep -qx sdkt.sha256 \
            || { echo "FAIL: sdkt.sha256 missing from tarball"; exit 1; }
          echo "OK: tarball contains sdkt and sdkt.sha256"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          cd target/${{ env.TARGET }}/release
          Compress-Archive -Path sdkt.exe, sdkt.sha256 -DestinationPath "sdkt-${{ env.TARGET }}.zip" -Force
        env:
          TARGET: ${{ matrix.target }}

      - name: Verify zip contents (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $zip = Get-Content "sdkt-${{ env.TARGET }}.zip" -Raw
          $entries = [System.IO.Compression.ZipFile]::OpenRead("sdkt-${{ env.TARGET }}.zip").Entries.Name
          Write-Host "Contents of sdkt-${{ env.TARGET }}.zip:"
          $entries | ForEach-Object { Write-Host "  $_" }
          if ($entries -notcontains "sdkt.exe") { Write-Error "FAIL: sdkt.exe missing from zip"; exit 1 }
          if ($entries -notcontains "sdkt.sha256") { Write-Error "FAIL: sdkt.sha256 missing from zip"; exit 1 }
          Write-Host "OK: zip contains sdkt.exe and sdkt.sha256"
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdkt-${{ matrix.target }}
          path: |
            sdkt-${{ matrix.target }}.tar.gz
            sdkt-${{ matrix.target }}.zip
            sdkt-${{ matrix.target }}.sha256
          if-no-files-not-found: error

  github-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/sdkt-*.tar.gz
            artifacts/sdkt-*.zip
            artifacts/sdkt-*.sha256
          generate_release_notes: true

  publish-crates:
    needs: [validate, version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates (dependency order)
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for c in sdkt-core sdkt-xdr sdkt-wasm sdkt-rpc sdkt-storage sdkt-audit sdkt-audit-example-rule sdkt-cli; do
            echo "== cargo publish -p $c =="
            cargo publish -p "$c"
          done
