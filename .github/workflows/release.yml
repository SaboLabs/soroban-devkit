name: Release

# Publishes prebuilt sdkt binaries and crates on a version tag (v*).
# Mirrors the CI gates (fmt/clippy/test) before shipping.

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Formatting
        run: cargo fmt --all --check
      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Tests
        run: cargo test --workspace

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish dry-run (whole workspace)
        # Validate packaging/uploadability of the entire workspace without
        # contacting crates.io for unpublished sibling crates. Unlike a
        # per-crate loop, this does not emit false-negative "no matching
        # version" errors for siblings that are not yet published.
        run: cargo publish --dry-run --workspace

  build-binaries:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin sdkt-cli
      - name: Package (unix)
        run: |
          BIN=target/${{ matrix.target }}/release/sdkt-cli
          tar -czf "sdkt-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" sdkt-cli
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sdkt-${{ matrix.target }}
          path: |
            sdkt-${{ matrix.target }}.tar.gz
            sdkt-${{ matrix.target }}.zip
          if-no-files-found: ignore

  github-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-crates:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates (dependency order)
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for c in sdkt-core sdkt-xdr sdkt-wasm sdkt-rpc sdkt-storage sdkt-audit sdkt-audit-example-rule sdkt-cli; do
            echo "== cargo publish -p $c =="
            cargo publish -p "$c"
          done
