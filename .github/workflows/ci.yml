name: CI

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format_and_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - name: Add WASM target
      run: rustup target add wasm32-wasip1

    - name: Check Formatting
      run: cargo fmt --all --check

    - name: Lint (Default)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Lint (All Features)
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Add WASM target
      run: rustup target add wasm32-wasip1

    - name: Run Tests (Default)
      run: cargo test --workspace

    - name: Run Tests (All Features)
      # Only run all-features on Linux to save matrix time, since Wasmtime/Extism
      # compilation takes minutes per platform.
      if: matrix.os == 'ubuntu-latest'
      run: cargo test -p sdkt-cli --test plugin_loading --all-features

  install-script:
    name: install-script validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Syntax check (no network)
      run: bash -n install.sh
    - name: ShellCheck (if available)
      run: |
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck install.sh
        else
          echo "shellcheck not installed; skipping (bash -n passed)"
        fi
    - name: Offline self-test (checksum standalone plus embedded fallback)
      run: bash install.sh --selftest

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Parse MSRV from Cargo.toml or fallback
    - name: Set up Rust (MSRV)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88.0"

    - uses: Swatinem/rust-cache@v2

    - name: Check MSRV
      run: cargo check --workspace
