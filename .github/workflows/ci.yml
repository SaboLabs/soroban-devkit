name: CI

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format_and_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - name: Add WASM target
      run: rustup target add wasm32-wasip1

    - name: Check Formatting
      run: cargo fmt --all --check

    - name: Lint (Default)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Lint (All Features)
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Add WASM target
      run: rustup target add wasm32-wasip1

    - name: Run Tests (Default)
      run: cargo test --workspace

    - name: Run Tests (All Features)
      # Only run all-features on Linux to save matrix time, since Wasmtime/Extism
      # compilation takes minutes per platform.
      if: matrix.os == 'ubuntu-latest'
      run: cargo test -p sdkt-cli --test plugin_loading --all-features

  supply-chain:
    name: supply-chain audit (best-effort)
    runs-on: ubuntu-latest
    # Advisory DB downloads or findings must never break the build.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      # Best-effort install; if the registry/network is unavailable the audit
      # step is skipped rather than failing the overall CI run.
      continue-on-error: true
      run: cargo install cargo-audit --locked

    - name: cargo audit (advisory DB best-effort)
      # Best-effort supply-chain audit. Replaces rustsec/audit-check@v2, which
      # posts a check run via the Checks API and fails with
      # "Resource not accessible by integration" when the job token lacks
      # `checks: write`. Running `cargo audit` directly needs no extra
      # permissions; `continue-on-error: true` on the step (and the job) keeps
      # advisory findings visible but non-fatal to the overall CI run.
      if: success()
      continue-on-error: true
      run: cargo audit

  install-script:
    name: install-script validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Syntax check (no network)
      run: bash -n install.sh
    - name: ShellCheck (if available)
      run: |
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck install.sh
        else
          echo "shellcheck not installed; skipping (bash -n passed)"
        fi
    - name: Offline self-test (checksum standalone plus embedded fallback)
      run: bash install.sh --selftest

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Parse MSRV from Cargo.toml or fallback
    - name: Set up Rust (MSRV)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88.0"

    - uses: Swatinem/rust-cache@v2

    - name: Check MSRV
      run: cargo check --workspace

  onboarding-smoke:
    name: offline onboarding smoke test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Build sdkt
      run: cargo build --bin sdkt

    - name: Run committed offline example smoke test
      run: bash scripts/smoke_examples.sh

  playground-wasm:
    name: playground WASM freshness
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@1.88.0
      with:
        targets: wasm32-unknown-unknown

    # Temporarily disabled while diagnosing WASM reproducibility.
    # - uses: Swatinem/rust-cache@v2

    - name: Install wasm-bindgen CLI
      run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

    - name: Show toolchain versions
      run: |
        rustc -Vv
        cargo -V
        wasm-bindgen --version

    - name: Check sdkt-playground
      run: cargo check --locked --manifest-path crates/sdkt-playground/Cargo.toml --target wasm32-unknown-unknown

    - name: Build playground WASM
      run: |
        cargo build --locked \
          --release \
          --target wasm32-unknown-unknown \
          --manifest-path crates/sdkt-playground/Cargo.toml

    - name: Generate playground artifacts
      run: |
        tmp_dir="$(mktemp -d)"
        echo "PLAYGROUND_WASM_OUT=$tmp_dir" >> "$GITHUB_ENV"

        wasm-bindgen \
          --target web \
          --no-typescript \
          --out-dir "$tmp_dir" \
          crates/sdkt-playground/target/wasm32-unknown-unknown/release/sdkt_playground.wasm

    - name: Check committed artifacts are fresh
      run: |
        cmp website/playground/wasm/sdkt_playground_bg.wasm \
          "$PLAYGROUND_WASM_OUT/sdkt_playground_bg.wasm"

        cmp website/playground/wasm/sdkt_playground.js \
          "$PLAYGROUND_WASM_OUT/sdkt_playground.js"

        echo "Playground WASM artifacts are up to date."