name: Good First Issue
description: A self-contained, beginner-friendly task for new contributors
title: "[Good First Issue]: "
labels: ["good first issue"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task description
      description: A small, well-scoped change a new contributor can complete.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where to look
      description: File(s) / module(s) / docs to touch.
      placeholder: |
        - crates/sdkt-cli/src/main.rs (command wiring)
        - docs/getting-started.md
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done? (tests, fmt, clippy, docs)
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context / hints
    validations:
      required: false
