name: "Soroban DevKit (sdkt) Action"
description: "Run sdkt capabilities in CI: static security audit (sdkt audit), contract upgrade-safety check (sdkt diff --upgrade-safety), and read-only release assurance (sdkt release-assurance)."
author: "SaboLabs"

inputs:
  command:
    description: "Which check to run: 'audit', 'upgrade-safety', or 'release-assurance'."
    required: true
  sdkt-version:
    description: "sdkt git tag to install (e.g. v2.6.0). Must be a published tag in SaboLabs/soroban-devkit."
    required: false
    default: "v2.6.0"
  target:
    description: "Source file (.rs) to audit (used with command=audit)."
    required: false
    default: ""
  old-wasm:
    description: "Baseline (currently deployed) WASM (used with command=upgrade-safety)."
    required: false
    default: ""
  new-wasm:
    description: "Candidate (new) WASM (used with command=upgrade-safety)."
    required: false
    default: ""
  severity-threshold:
    description: "Minimum severity that fails the audit. One of: critical, warning, info. Default: critical (MOVE-001 warnings never fail CI)."
    required: false
    default: "critical"
  wasm:
    description: "Candidate WASM artifact to assess (used with command=release-assurance). Required for that command."
    required: false
    default: ""
  previous-wasm:
    description: "Previous (baseline) WASM for the offline upgrade-safety diff (used with command=release-assurance). Optional."
    required: false
    default: ""
  audit:
    description: "Rust source file(s) or directory for the static audit (used with command=release-assurance). Space-separated; each becomes a separate --audit argument."
    required: false
    default: ""
  disable:
    description: "Audit rule id(s) to disable (used with command=release-assurance). Space-separated; each becomes a repeated --disable argument."
    required: false
    default: ""
  contract:
    description: "Deployed contract ID (C...) for the on-chain verification + health checks (used with command=release-assurance). Optional; on-chain checks are skipped when empty."
    required: false
    default: ""
  network:
    description: "Deployed network (testnet | mainnet | futurenet) for the on-chain checks (used with command=release-assurance). Only meaningful with 'contract'."
    required: false
    default: ""
  max-size-bytes:
    description: "Fail the release when the candidate artifact exceeds N bytes (used with command=release-assurance). Optional; forwards --max-size-bytes. Operator-supplied policy, SDKT hardcodes no network limit. Violates when size > N; exactly N passes."
    required: false
    default: ""
  max-growth-pct:
    description: "Fail the release when the candidate grew more than N percent over 'previous-wasm' (used with command=release-assurance). Optional; forwards --max-growth-pct. Requires 'previous-wasm'. Violates when growth > N; exactly N passes."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install sdkt
      shell: bash
      run: |
        # When this Action runs inside the sdkt repository itself (e.g. during
        # PR validation), the checked-out workspace already contains the CLI.
        # Install from the local path instead of fetching a git tag — the tag
        # may not exist on the remote yet. For external consumers, fall back to
        # the published git tag. External behavior is unchanged.
        if [ -f "crates/sdkt-cli/Cargo.toml" ]; then
          echo "Detected sdkt workspace checkout — installing from local path."
          cargo install --path crates/sdkt-cli --locked
        else
          echo "External consumer — installing from git tag ${{ inputs.sdkt-version }}."
          cargo install --git https://github.com/SaboLabs/soroban-devkit --tag "${{ inputs.sdkt-version }}" sdkt-cli --locked
        fi

        INSTALL_DIR="${CARGO_HOME:-$HOME/.cargo}/bin"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Run sdkt audit
      if: ${{ inputs.command == 'audit' }}
      shell: bash
      env:
        SDKT_TARGET: ${{ inputs.target }}
        SDKT_THRESHOLD: ${{ inputs.severity-threshold }}
      run: |
        set -euo pipefail
        if [ -z "$SDKT_TARGET" ]; then
          echo "::error::audit command requires 'target' (path to a .rs source file)"
          exit 1
        fi
        echo "Running: sdkt audit $SDKT_TARGET --format json"
        OUT=$(sdkt audit "$SDKT_TARGET" --format json)
        echo "$OUT"
        CRIT=$(echo "$OUT" | jq '.summary.critical')
        WARN=$(echo "$OUT" | jq '.summary.warning')
        INFO=$(echo "$OUT" | jq '.summary.info')
        echo "Findings -> critical=$CRIT warning=$WARN info=$INFO (threshold=$SDKT_THRESHOLD)"
        FAIL=0
        case "$SDKT_THRESHOLD" in
          critical) [ "${CRIT:-0}" -gt 0 ] && FAIL=1 ;;
          warning)  [ "${CRIT:-0}" -gt 0 ] || [ "${WARN:-0}" -gt 0 ] && FAIL=1 ;;
          info)     [ "${CRIT:-0}" -gt 0 ] || [ "${WARN:-0}" -gt 0 ] || [ "${INFO:-0}" -gt 0 ] && FAIL=1 ;;
          *) echo "::error::invalid severity-threshold '$SDKT_THRESHOLD'"; exit 1 ;;
        esac
        if [ "$FAIL" -eq 1 ]; then
          echo "::error::sdkt audit found findings at or above threshold '$SDKT_THRESHOLD'"
          exit 1
        fi
        echo "sdkt audit passed (nothing at or above threshold '$SDKT_THRESHOLD')."

    - name: Run sdkt upgrade-safety
      if: ${{ inputs.command == 'upgrade-safety' }}
      shell: bash
      env:
        SDKT_OLD: ${{ inputs.old-wasm }}
        SDKT_NEW: ${{ inputs.new-wasm }}
      run: |
        set -euo pipefail
        if [ -z "$SDKT_OLD" ] || [ -z "$SDKT_NEW" ]; then
          echo "::error::upgrade-safety command requires both 'old-wasm' and 'new-wasm'"
          exit 1
        fi
        echo "Running: sdkt diff --old-wasm $SDKT_OLD --new-wasm $SDKT_NEW --upgrade-safety --format json"
        OUT=$(sdkt diff --old-wasm "$SDKT_OLD" --new-wasm "$SDKT_NEW" --upgrade-safety --format json)
        echo "$OUT"
        COMPAT=$(echo "$OUT" | jq '.compatible')
        echo "Upgrade verdict compatible=$COMPAT"
        if [ "$COMPAT" != "true" ]; then
          echo "::error::upgrade is NOT backwards-compatible (breaking changes detected)"
          exit 1
        fi
        echo "sdkt upgrade-safety passed (upgrade is backwards-compatible)."

    - name: Run sdkt release-assurance
      if: ${{ inputs.command == 'release-assurance' }}
      shell: bash
      env:
        SDKT_WASM: ${{ inputs.wasm }}
        SDKT_PREV_WASM: ${{ inputs.previous-wasm }}
        SDKT_AUDIT: ${{ inputs.audit }}
        SDKT_DISABLE: ${{ inputs.disable }}
        SDKT_CONTRACT: ${{ inputs.contract }}
        SDKT_NETWORK: ${{ inputs.network }}
        SDKT_MAX_SIZE_BYTES: ${{ inputs.max-size-bytes }}
        SDKT_MAX_GROWTH_PCT: ${{ inputs.max-growth-pct }}
      run: |
        set -euo pipefail
        if [ -z "$SDKT_WASM" ]; then
          echo "::error::release-assurance command requires 'wasm' (path to the candidate .wasm artifact)"
          exit 1
        fi
        # Variadic --audit and repeated --disable: split the space-separated
        # inputs into individual arguments. Optional single-value flags are
        # appended only when non-empty so CLI defaults stay in charge.
        ARGS=(--wasm "$SDKT_WASM")
        if [ -n "$SDKT_PREV_WASM" ]; then ARGS+=(--previous-wasm "$SDKT_PREV_WASM"); fi
        if [ -n "$SDKT_AUDIT" ]; then
          for path in $SDKT_AUDIT; do ARGS+=(--audit "$path"); done
        fi
        if [ -n "$SDKT_DISABLE" ]; then
          for rule in $SDKT_DISABLE; do ARGS+=(--disable "$rule"); done
        fi
        if [ -n "$SDKT_CONTRACT" ]; then ARGS+=(--contract "$SDKT_CONTRACT"); fi
        if [ -n "$SDKT_NETWORK" ]; then ARGS+=(--network "$SDKT_NETWORK"); fi
        # Opt-in WASM size policy: forwarded only when the input is non-empty so
        # the CLI's own defaults and validation stay in charge.
        if [ -n "$SDKT_MAX_SIZE_BYTES" ]; then ARGS+=(--max-size-bytes "$SDKT_MAX_SIZE_BYTES"); fi
        if [ -n "$SDKT_MAX_GROWTH_PCT" ]; then ARGS+=(--max-growth-pct "$SDKT_MAX_GROWTH_PCT"); fi
        echo "Running: sdkt release-assurance ${ARGS[*]} --format json"
        # The CLI itself exits 1 when release_status is FAIL; capture the JSON
        # either way and let .release_status drive the verdict (FAIL -> exit 1,
        # PASS/REVIEW/SKIPPED -> exit 0), matching the CLI's own semantics.
        OUT=$(sdkt release-assurance "${ARGS[@]}" --format json) && RC=0 || RC=$?
        echo "$OUT"
        STATUS=$(echo "$OUT" | jq -r '.release_status')
        echo "Release assurance status: $STATUS (cli exit code $RC)"
        if [ "$STATUS" = "FAIL" ]; then
          echo "::error::sdkt release-assurance reported FAIL (see report above)"
          exit 1
        fi
        echo "sdkt release-assurance passed (release_status=$STATUS)."
